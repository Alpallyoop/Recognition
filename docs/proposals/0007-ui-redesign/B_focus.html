<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recognition Focus</title>
<style>
/* Direction B, "Focus": tabs and the address live in one left sidebar (like Edge vertical tabs or Arc); the page sits in an inset card
   and gets the full height. One command bar (Ctrl+K) replaces the long menu. Layout: sidebar / slim page bar / page card. */
:root{
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif; --display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --h1:30px;--h1w:700;--h1ls:-.02em;--r-btn:9px;--r-card:14px;
  --desk:#e4e3f1; --side:#e9e8f6; --side-hover:rgba(48,40,140,.07); --side-on:#ffffff; --page:#fbfbfe; --surface:#ffffff; --surface2:#f0eff8; --hover:rgba(48,40,140,.06);
  --line:#e4e2f0; --line-strong:#cfcce3; --text:#1b1a2e; --muted:#62607a;
  --accent:#5546d9; --accent2:#c04fd0; --accent-ink:#fff; --accent-text:#4434c4;
  --ok:#137a49; --ok-bg:#e1f4ea; --ok-line:#bde5cf; --warn:#9a5a00; --warn-bg:#fff0d9; --bad:#b4233a; --bad-bg:#fde6ea;
  --toast:#1b1a2e; --toast-ink:#fff; --shadow:0 18px 40px rgba(27,26,46,.2),0 2px 8px rgba(27,26,46,.08); --shadow-sm:0 1px 3px rgba(27,26,46,.08);
  --card-shadow:0 0 0 1px rgba(27,26,46,.06),0 4px 18px rgba(27,26,46,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --desk:#0f0e16; --side:#14131c; --side-hover:rgba(255,255,255,.06); --side-on:#262435; --page:#1c1b26; --surface:#232130; --surface2:#1a1924; --hover:rgba(255,255,255,.06);
  --line:#2e2c3d; --line-strong:#3d3a50; --text:#ebeaf5; --muted:#a19eb8;
  --accent:#8b7dff; --accent2:#e07ff0; --accent-ink:#14121f; --accent-text:#ab9fff;
  --ok:#62d69c; --ok-bg:rgba(98,214,156,.12); --ok-line:rgba(98,214,156,.3); --warn:#f3b552; --warn-bg:rgba(243,181,82,.13); --bad:#ff8a9a; --bad-bg:rgba(255,138,154,.12);
  --toast:#ebeaf5; --toast-ink:#14121f; --shadow:0 18px 44px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3); --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --card-shadow:0 0 0 1px rgba(255,255,255,.05),0 6px 22px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#0f0e16; --side:#14131c; --side-hover:rgba(255,255,255,.06); --side-on:#262435; --page:#1c1b26; --surface:#232130; --surface2:#1a1924; --hover:rgba(255,255,255,.06);
  --line:#2e2c3d; --line-strong:#3d3a50; --text:#ebeaf5; --muted:#a19eb8;
  --accent:#8b7dff; --accent2:#e07ff0; --accent-ink:#14121f; --accent-text:#ab9fff;
  --ok:#62d69c; --ok-bg:rgba(98,214,156,.12); --ok-line:rgba(98,214,156,.3); --warn:#f3b552; --warn-bg:rgba(243,181,82,.13); --bad:#ff8a9a; --bad-bg:rgba(255,138,154,.12);
  --toast:#ebeaf5; --toast-ink:#14121f; --shadow:0 18px 44px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3); --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --card-shadow:0 0 0 1px rgba(255,255,255,.05),0 6px 22px rgba(0,0,0,.35);
}
/* shared by the three prototypes: pages, controls, fake sites. Colour comes only from the variant's tokens. */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--text);font-family:var(--font);font-size:13.5px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.fav{width:18px;height:18px;border-radius:5px;display:inline-grid;place-items:center;color:#fff;font-size:10.5px;font-weight:700;flex:none;letter-spacing:0}
.fav.sm{width:28px;height:28px;border-radius:8px;font-size:13px}

/* buttons, chips, toggles, segmented */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:var(--r-btn);border:1px solid var(--line-strong);background:var(--surface);font-weight:550;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-text)}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}.dot.ok{background:var(--ok);box-shadow:0 0 0 4px var(--ok-bg)}
.tgl{width:38px;height:22px;border-radius:999px;background:var(--line-strong);position:relative;flex:none;transition:background .15s}
.tgl i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.tgl.on{background:var(--accent)}.tgl.on i{transform:translateX(16px)}
.seg{display:inline-flex;padding:3px;border-radius:calc(var(--r-btn) + 2px);background:var(--surface2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{height:26px;padding:0 12px;border-radius:var(--r-btn);font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* internal pages */
.ip{height:100%;overflow:auto;background:var(--page)}
.ip-wrap{max-width:820px;margin:0 auto;padding:40px 32px 80px;display:flex;flex-direction:column;gap:14px}
.ip-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.ip-head h1{font-family:var(--display);font-size:var(--h1);font-weight:var(--h1w);letter-spacing:var(--h1ls);margin:0 0 4px;text-wrap:balance}
.ip-lede{margin:0;color:var(--muted);max-width:60ch;line-height:1.5}
.ip-h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:650;margin:18px 0 0}
.ip-banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-card);background:var(--ok-bg);border:1px solid var(--ok-line);flex-wrap:wrap}
.ip-banner>div{flex:1 1 220px;display:flex;flex-direction:column;gap:2px}.ip-banner span{color:var(--muted);font-size:12.5px}
.ip-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{padding:14px 16px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-weight:650;font-family:var(--display);letter-spacing:-.01em}.stat span{color:var(--muted);font-size:12.5px}
.stat.warn b{color:var(--warn)}
.ip-toolbar input{width:100%;height:36px;padding:0 12px;border-radius:var(--r-btn);border:1px solid var(--line-strong);background:var(--surface)}
.ip-list{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);overflow:hidden}
.ip-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;min-height:56px}
.ip-item:first-child{border-top:0}
.ip-item-main{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:2px}
.ip-item-main b{font-weight:600}.ip-item-main span{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.ip-where{font-size:12px;color:var(--muted);width:92px}
.ip-actions{display:flex;gap:4px}
.ip-val{color:var(--muted);font-size:13px}
.ip-how{color:var(--muted);font-size:12.5px;line-height:1.55;margin-top:8px}
.ip-how summary{cursor:pointer;color:var(--accent-text);font-weight:550;width:max-content}
.ip-how p{max-width:68ch}

/* start page */
.ip-start{display:flex;flex-direction:column;align-items:center;gap:28px;padding-top:9vh}
.ip-start-brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px;font-weight:650;letter-spacing:-.01em}
.ip-mark{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 210deg,var(--accent),var(--accent2),var(--accent));box-shadow:inset 0 0 0 5px var(--page)}
.ip-search{display:flex;width:min(560px,100%);height:48px;border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow-sm);overflow:hidden}
.ip-search input{flex:1;border:0;background:transparent;padding:0 20px;font-size:15px;outline:none;min-width:0}
.ip-search button{width:48px;font-size:18px;color:var(--accent-text)}
.ip-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;width:min(660px,100%)}
.ip-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:var(--r-card);color:var(--text);text-decoration:none;font-size:12.5px;text-align:center;overflow-wrap:break-word;min-width:0}
.ip-tile:hover{background:var(--hover)}.ip-tile .fav{width:36px;height:36px;border-radius:10px;font-size:15px}
.ip-week{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:12.5px}
.ip-week div{display:flex;align-items:baseline;gap:6px}.ip-week b{color:var(--text);font-size:15px}

/* site panel */
.sp{display:flex;flex-direction:column;min-width:0}
.sp-head{padding:14px 16px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line)}
.sp-head b{font-size:14px}.sp-head span{color:var(--muted);font-size:12.5px;line-height:1.4}
.sp-head.sec-secure span{color:var(--ok)}.sp-head.sec-notsecure{background:var(--warn-bg)}.sp-head.sec-notsecure span{color:var(--warn)}
.sp-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.sp-row:first-of-type{border-top:0}
.sp-row>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.sp-row span{color:var(--muted);font-size:12px}

/* loading, toast */
.loading{height:100%;display:grid;place-items:center;background:var(--page)}
.loading i{width:28px;height:28px;border-radius:50%;border:3px solid var(--line-strong);border-top-color:var(--accent);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));background:var(--toast);color:var(--toast-ink);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;z-index:50}

/* the fake web: websites keep their own light look in every theme, as real ones do */
.web{height:100%;overflow:auto;background:#fff;color:#1f2328;font-family:Georgia,"Times New Roman",serif}
.w-site{min-height:100%}
.w-mast{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;padding:16px 28px;border-bottom:1px solid #e5e7eb;font-family:system-ui,"Segoe UI",sans-serif}
.w-mast b{font-size:19px}.w-mast span{color:#6b7280;font-size:13px}
.w-art{max-width:680px;margin:0 auto;padding:28px 24px 60px;font-size:17px;line-height:1.6}
.w-art h2{font-size:30px;line-height:1.2;margin:4px 0 8px;text-wrap:balance}
.w-kick{font:600 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:#c2410c}
.w-meta{font:13px system-ui,sans-serif;color:#6b7280}
.w-img{height:220px;border-radius:6px;background:linear-gradient(160deg,#9cc3d5 0%,#cfe0d8 45%,#e8d9b5 46%,#c9b48a 100%)}
.w-ad{font:12px system-ui,sans-serif;color:#9ca3af;border:1px dashed #d1d5db;border-radius:6px;padding:20px;text-align:center;margin:18px 0}
.w-post{border-top:1px solid #e5e7eb;padding:12px 0}.w-post b{font:600 14px system-ui,sans-serif}.w-post p{margin:4px 0 0}
.w-warnbox{font:13px system-ui,sans-serif;background:#fff7e6;color:#92400e;border:1px solid #f5d39b;border-radius:6px;padding:12px;margin-top:18px}
.w-login{max-width:360px;margin:48px auto;padding:28px;border:1px solid #e5e7eb;border-radius:10px;font-family:system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;gap:12px}
.w-login h2{font-size:20px;margin:0 0 4px}.w-login label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#374151}
.w-login input{height:38px;border:1px solid #d1d5db;border-radius:6px;padding:0 10px;color:#111;background:#fff}
.w-btn{height:40px;border-radius:6px;background:#15803d;color:#fff;font-weight:600;margin-top:4px}
.w-small{font-size:12px;color:#6b7280;margin:0}
.w-res{padding:10px 0;border-bottom:1px solid #eee;display:flex;flex-direction:column;font-family:system-ui,sans-serif}.w-res a{color:#1d4ed8;font-size:17px}.w-res span{color:#15803d;font-size:12.5px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){.ip-wrap{padding:24px 16px 60px}.ip-where{display:none}}

:root.m-light{color-scheme:light;
  --desk:#e4e3f1; --side:#e9e8f6; --side-hover:rgba(48,40,140,.07); --side-on:#fff; --page:#fbfbfe; --surface:#fff; --surface2:#f0eff8; --hover:rgba(48,40,140,.06);
  --line:#e4e2f0; --line-strong:#cfcce3; --text:#1b1a2e; --muted:#62607a; --accent:#5546d9; --accent2:#c04fd0; --accent-ink:#fff; --accent-text:#4434c4;
  --ok:#137a49; --ok-bg:#e1f4ea; --ok-line:#bde5cf; --warn:#9a5a00; --warn-bg:#fff0d9; --bad:#b4233a; --bad-bg:#fde6ea;
  --toast:#1b1a2e; --toast-ink:#fff; --shadow:0 18px 40px rgba(27,26,46,.2),0 2px 8px rgba(27,26,46,.08); --shadow-sm:0 1px 3px rgba(27,26,46,.08); --card-shadow:0 0 0 1px rgba(27,26,46,.06),0 4px 18px rgba(27,26,46,.08)}
:root.m-dark{color-scheme:dark;
  --desk:#0f0e16; --side:#14131c; --side-hover:rgba(255,255,255,.06); --side-on:#262435; --page:#1c1b26; --surface:#232130; --surface2:#1a1924; --hover:rgba(255,255,255,.06);
  --line:#2e2c3d; --line-strong:#3d3a50; --text:#ebeaf5; --muted:#a19eb8; --accent:#8b7dff; --accent2:#e07ff0; --accent-ink:#14121f; --accent-text:#ab9fff;
  --ok:#62d69c; --ok-bg:rgba(98,214,156,.12); --ok-line:rgba(98,214,156,.3); --warn:#f3b552; --warn-bg:rgba(243,181,82,.13); --bad:#ff8a9a; --bad-bg:rgba(255,138,154,.12);
  --toast:#ebeaf5; --toast-ink:#14121f; --shadow:0 18px 44px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.3); --shadow-sm:0 1px 3px rgba(0,0,0,.4); --card-shadow:0 0 0 1px rgba(255,255,255,.05),0 6px 22px rgba(0,0,0,.35)}

#app{height:100%;display:flex;background:var(--side)}
/* sidebar */
.side{width:268px;flex:none;display:flex;flex-direction:column;gap:10px;padding:10px 10px 10px 10px;min-height:0;transition:width .18s}
.side.mini{width:64px}
.srow{display:flex;align-items:center;gap:2px}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;position:relative}
.ib:hover{background:var(--side-hover);color:var(--text)}.ib .ic{width:17px;height:17px}
.grow{flex:1}
.omni{display:flex;align-items:center;gap:4px;height:40px;padding:0 4px 0 2px;border-radius:12px;background:var(--side-on);box-shadow:var(--shadow-sm);min-width:0}
.omni:focus-within{box-shadow:0 0 0 2px var(--accent)}
.site{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.site:hover{background:var(--hover)}.site .ic{width:15px;height:15px}
.site.secure{color:var(--muted)}.site.notsecure{color:var(--warn);background:var(--warn-bg)}.site.internal{color:var(--accent-text)}
.omni form{flex:1;min-width:0;display:flex}
.omni input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:13px;padding:0 4px}
.pins{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pin{height:44px;border-radius:11px;background:var(--side-hover);display:grid;place-items:center;color:var(--muted);position:relative}
.pin:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 12%,transparent)}.pin.on{background:var(--side-on);color:var(--accent-text);box-shadow:var(--shadow-sm)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:650;padding:6px 8px 0;display:flex;align-items:center;justify-content:space-between}
.tlist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -2px;padding:0 2px}
.vt{display:flex;align-items:center;gap:10px;height:36px;padding:0 4px 0 10px;border-radius:9px;color:var(--text);cursor:default;flex:none}
.vt:hover{background:var(--side-hover)}.vt.on{background:var(--side-on);box-shadow:var(--shadow-sm);font-weight:550}
.vt .t{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.vt .x{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;opacity:0;color:var(--muted)}
.vt:hover .x,.vt.on .x{opacity:1}.vt .x:hover{background:var(--hover)}.vt .x .ic{width:13px;height:13px}
.vt .spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:none}
.vt.add{color:var(--muted)}.vt.add .ic{width:16px;height:16px;margin:0 1px}
.kbar{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:9px;color:var(--muted);border:1px dashed var(--line-strong)}
.kbar:hover{color:var(--text);border-style:solid}.kbar kbd{margin-left:auto;font:11px var(--font);padding:2px 6px;border-radius:5px;background:var(--side-hover)}
.side.mini .omni form,.side.mini .lbl,.side.mini .vt .t,.side.mini .vt .x,.side.mini .kbar span,.side.mini .kbar kbd,.side.mini .hide-mini{display:none}
.side.mini .pins{grid-template-columns:1fr}.side.mini .vt{justify-content:center;padding:0}.side.mini .omni{justify-content:center}.side.mini .kbar{justify-content:center;padding:0}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 8px 8px 0}
.pbar{display:flex;align-items:center;gap:6px;height:34px;padding:0 0 4px 6px;min-width:0}
.pbar .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:12.5px}
.pbar .ib.on{color:var(--accent-text)}
.shieldpill{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--side-hover);color:var(--muted);font-size:12px;font-weight:600}
.shieldpill:hover{color:var(--text)}.shieldpill .ic{width:15px;height:15px}.shieldpill.on{color:var(--ok)}.shieldpill.off{color:var(--warn)}
.wc{display:flex;margin-left:6px}.wc span{width:40px;height:28px;display:grid;place-items:center;color:var(--muted);font-size:12px}
.card{flex:1;min-height:0;border-radius:12px;overflow:hidden;box-shadow:var(--card-shadow);position:relative;background:var(--page)}
/* overlays */
.pop{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pop.site-pop{right:8px;top:8px;width:340px;max-width:calc(100% - 16px)}
.scrim{position:fixed;inset:0;background:rgba(15,14,24,.28);z-index:40;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.cmd{width:min(600px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.cmd-in{display:flex;align-items:center;gap:10px;padding:0 16px;height:54px;border-bottom:1px solid var(--line)}
.cmd-in .ic{color:var(--muted)}
.cmd-in input{flex:1;border:0;outline:none;background:transparent;font-size:16px;min-width:0}

    switch (a) {
      case "go": go(el.getAttribute("data-url")); break;
      case "tab": st.active = +el.getAttribute("data-i"); st.pop = null; break;
      case "close": e.stopPropagation(); closeTab(+el.getAttribute("data-id")); break;
      case "new": newTab(); setTimeout(function(){ var a = document.getElementById("addr"); if (a) a.focus(); }, 0); break;
      case "private": newTab(); toast("Private tab: nothing from it is saved after you close it."); break;
      case "reopen": if (st.closed.length) newTab(st.closed.pop()); else toast("No closed tabs to reopen."); break;
      case "back": case "fwd": toast("Back and forward work as usual in the real browser."); break;
      case "reload": cur().loading = true; setTimeout(function(){ cur().loading = false; App.render(); }, 380); break;
      case "pop": var p = el.getAttribute("data-pop"); st.pop = st.pop === p ? null : p; break;
      case "toggle": var id = el.getAttribute("data-id");
        if (id === "shield-all") st.shieldOn = !st.shieldOn;
        else if (id === "site-shield") { var h = hostOf(cur().url); st.siteShield[h] = st.siteShield[h] === false; toast(st.siteShield[h] === false ? "Shield is off for " + h + "." : "Shield is on for " + h + "."); }
        else if (id.indexOf("list-") === 0) { var l = LISTS.filter(function(x){ return "list-" + x.id === id; })[0]; if (l) l.on = !l.on; }
        else if (id === "https") SETTINGS.httpsFirst = !SETTINGS.httpsFirst; else if (id === "restore") SETTINGS.restore = !SETTINGS.restore;
        break;
      case "seg": var k = el.getAttribute("data-id"), v = el.getAttribute("data-val"); if (k === "theme") { st.theme = v; } if (k === "density") st.density = v; applyTheme(); break;
      case "move": LOGINS.forEach(function(l){ l.where = "SoteriaVault"; }); toast("Moved to SoteriaVault. Duplicates were merged there."); break;
      case "fill": var em = document.getElementById("w-email"), pw = document.getElementById("w-pass"); st.pop = null;
        toast("SoteriaVault asked you, and you allowed it. Filled, not submitted.");
        setTimeout(function(){ var em2 = document.getElementById("w-email"), pw2 = document.getElementById("w-pass"); if (em2) em2.value = "alex.m@example.com"; if (pw2) pw2.value = "correct-horse-battery"; }, 30); break;
      case "site-signin": toast("This is a pretend site: nothing was sent."); break;
      case "toast": toast(el.getAttribute("data-msg")); st.pop = null; break;
      case "theme-quick": st.theme = isDark() ? "light" : "dark"; applyTheme(); break;
      case "noop": break;
      default: return false;
    }
    App.render(); return true;
  }

  function wire(root){
    root.addEventListener("click", function(e){
      if (handle(e)) return;
      if (st.pop && !e.target.closest(".pop") && !e.target.closest("[data-pop]")) { st.pop = null; App.render(); }
    });
    root.addEventListener("submit", function(e){ e.preventDefault(); var f = e.target; if (f.getAttribute("data-act") === "addr" ) { go(document.getElementById("addr").value); App.render(); } if (f.getAttribute("data-act") === "start-search") { go(document.getElementById("start-q").value); App.render(); } });
    root.addEventListener("input", function(e){ if (e.target.id === "pw-filter") { st.pwFilter = e.target.value; var pos = e.target.selectionStart; App.render(); var f = document.getElementById("pw-filter"); if (f) { f.focus(); f.setSelectionRange(pos,pos); } } });
    document.addEventListener("keydown", function(e){
      var mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === "t") { e.preventDefault(); newTab(); App.render(); var a = document.getElementById("addr"); if (a) a.focus(); }
      else if (mod && e.key.toLowerCase() === "w") { e.preventDefault(); closeTab(cur().id); App.render(); }
      else if (mod && e.key.toLowerCase() === "l") { e.preventDefault(); var b = document.getElementById("addr"); if (b) { b.focus(); b.select(); } }
      else if (e.key === "Escape" && st.pop) { st.pop = null; App.render(); }
      else if (App.key) App.key(e);
    });
  }

  newTab("https://news.example/"); newTab("https://shop.example/"); newTab("recognition:passwords"); st.active = 0;

  return { st: st, icon: icon, isDark: isDark, esc: esc, siteOf: siteOf, hostOf: hostOf, security: security, SEC: SEC, PAGES: PAGES, pageHtml: pageHtml, sitePanelHtml: sitePanelHtml, wire: wire, go: go, newTab: newTab, cur: cur, toast: toast, applyTheme: applyTheme, parse: parse };
})();

var App = (function(){
  var I = R.icon, st = R.st, esc = R.esc, mini = false, cmdOpen = false, cmdQ = "", cmdSel = 0;
  var PINS = [["passwords","key","Passwords"],["shield","shield","Shield"],["history","history","History"],["downloads","download","Downloads"]];
  function commands(){
    var c = [
      { g: "Actions", ic: "plus", label: "New tab", hint: "Ctrl+T", run: function(){ R.newTab(); } },
      { g: "Actions", ic: "private", label: "New private tab", hint: "Ctrl+Shift+N", run: function(){ R.newTab(); R.toast("Private tab: nothing from it is saved after you close it."); } },
      { g: "Actions", ic: "reload", label: "Reopen closed tab", hint: "Ctrl+Shift+T", run: function(){ if (st.closed.length) R.newTab(st.closed.pop()); else R.toast("No closed tabs to reopen."); } },
      { g: "Actions", ic: "search", label: "Find in page", hint: "Ctrl+F", run: function(){ R.toast("Find bar opens above the page."); } },
      { g: "Actions", ic: "receipt", label: "Save page as PDF", hint: "", run: function(){ R.toast("Saved as PDF (prototype)."); } },
      { g: "Actions", ic: "receipt", label: "Full-page screenshot", hint: "", run: function(){ R.toast("Screenshot saved (prototype)."); } },
      { g: "Actions", ic: "sun", label: "Switch light / dark", hint: "", run: function(){ st.theme = R.isDark() ? "light" : "dark"; R.applyTheme(); } },
      { g: "Actions", ic: "sidebar", label: mini ? "Expand sidebar" : "Collapse sidebar", hint: "Ctrl+B", run: function(){ mini = !mini; } },
      { g: "Actions", ic: "receipt", label: "Export session (evidence packet)", hint: "", run: function(){ R.toast("Session packet written to packets\\outbox (prototype)."); } },
      { g: "Pages", ic: "key", label: "Passwords", url: "recognition:passwords" }, { g: "Pages", ic: "shield", label: "Shield", url: "recognition:shield" },
      { g: "Pages", ic: "settings", label: "Settings", url: "recognition:settings" }, { g: "Pages", ic: "puzzle", label: "Extensions", url: "recognition:extensions" },
      { g: "Pages", ic: "history", label: "History", url: "recognition:history" }, { g: "Pages", ic: "download", label: "Downloads", url: "recognition:downloads" }
    ];
    st.tabs.forEach(function(t, i){ var s = R.siteOf(t.url); c.push({ g: "Open tabs", ic: "globe", label: s.title, hint: s.short, tab: i }); });
    var q = cmdQ.trim().toLowerCase();
    var out = c.filter(function(x){ return !q || x.label.toLowerCase().indexOf(q) >= 0 || (x.hint||"").toLowerCase().indexOf(q) >= 0; });
    if (q) out.push({ g: "Go", ic: "search", label: (R.parse(cmdQ)||"").indexOf("search.example") >= 0 ? "Search for “" + cmdQ.trim() + "”" : "Open " + cmdQ.trim(), go: cmdQ });
    return out;
  }
  function runCmd(x){ cmdOpen = false; cmdQ = ""; if (!x) return; if (x.run) x.run(); else if (x.url) R.go(x.url); else if (x.tab != null) st.active = x.tab; else if (x.go) R.go(x.go); render(); }

  function render(){
    var t = R.cur(), s = R.siteOf(t.url), sec = R.security(t.url), host = R.hostOf(t.url);
    var shieldOn = st.shieldOn && st.siteShield[host] !== false;
    var addrVal = s.internal ? (s.internal === "start" ? "" : t.url) : t.url.replace(/^https:\/\//, "").replace(/\/$/, "");
    var focusId = document.activeElement && document.activeElement.id, typed = focusId === "addr" ? document.getElementById("addr").value : null;
    var h = '<aside class="side' + (mini?' mini':'') + '" aria-label="Tabs and address">' +
      '<div class="srow"><button class="ib" data-act="sidebar" title="' + (mini?'Expand':'Collapse') + ' sidebar (Ctrl+B)" aria-label="Toggle sidebar">' + I("sidebar") + '</button><span class="grow hide-mini"></span>' +
        '<button class="ib hide-mini" data-act="back" title="Back" aria-label="Back">' + I("back") + '</button><button class="ib hide-mini" data-act="fwd" title="Forward" aria-label="Forward">' + I("fwd") + '</button><button class="ib hide-mini" data-act="reload" title="Reload" aria-label="Reload">' + I("reload") + '</button></div>' +
      '<div class="omni"><button class="site ' + sec + '" data-act="pop" data-pop="site" title="' + esc(R.SEC[sec].words) + '" aria-label="Site information">' + I(R.SEC[sec].glyph) + '</button>' +
        '<form data-act="addr"><input id="addr" aria-label="Address" placeholder="Search or type an address" value="' + esc(typed != null ? typed : addrVal) + '" autocomplete="off" spellcheck="false"></form></div>' +
      '<div class="pins">' + PINS.map(function(p){ return '<button class="pin' + (s.internal===p[0]?' on':'') + '" data-act="go" data-url="recognition:' + p[0] + '" title="' + p[2] + '" aria-label="' + p[2] + '">' + I(p[1]) + '</button>'; }).join('') + '</div>' +
      '<div class="lbl"><span>Tabs</span><span class="num">' + st.tabs.length + '</span></div>' +
      '<div class="tlist" role="tablist">' + st.tabs.map(function(tb, i){ var ss = R.siteOf(tb.url);
        return '<div class="vt' + (i===st.active?' on':'') + '" role="tab" aria-selected="' + (i===st.active) + '" tabindex="0" data-act="tab" data-i="' + i + '" title="' + esc(ss.title) + '">' +
          (tb.loading ? '<span class="spin"></span>' : '<span class="fav" style="background:' + ss.color + '">' + ss.letter + '</span>') + '<span class="t">' + esc(ss.title) + '</span>' +
          '<button class="x" data-act="close" data-id="' + tb.id + '" aria-label="Close tab">' + I("x") + '</button></div>'; }).join('') +
        '<button class="vt add" data-act="new" title="New tab (Ctrl+T)">' + I("plus") + '<span class="t">New tab</span></button></div>' +
      '<button class="kbar" data-act="cmd" title="Command bar (Ctrl+K)">' + I("keyboard") + '<span>Commands and pages</span><kbd>Ctrl K</kbd></button>' +
      '<div class="srow"><button class="ib" data-act="go" data-url="recognition:settings" title="Settings" aria-label="Settings">' + I("settings") + '</button><button class="ib hide-mini" data-act="go" data-url="recognition:extensions" title="Extensions" aria-label="Extensions">' + I("puzzle") + '</button><span class="grow"></span><button class="ib hide-mini" data-act="theme-quick" title="Switch light / dark" aria-label="Switch light or dark">' + I("sun") + '</button></div>' +
      '</aside>' +
      '<div class="main"><div class="pbar"><span class="title">' + esc(s.title) + '</span>' +
        (!s.internal ? '<button class="shieldpill ' + (shieldOn?'on':'off') + '" data-act="pop" data-pop="site" title="Shield and site settings">' + I("shield") + '<span class="num">' + (shieldOn ? s.trackers + ' blocked' : 'Shield off') + '</span></button>' : '') +
        (s.login ? '<button class="ib on" data-act="pop" data-pop="site" title="Logins for this site (SoteriaVault)" aria-label="Logins">' + I("key") + '</button>' : '') +
        (!s.internal ? '<button class="ib" data-act="toast" data-msg="Bookmarked." title="Bookmark (Ctrl+D)" aria-label="Bookmark">' + I("star") + '</button>' : '') +
        '<div class="wc" aria-hidden="true"><span>—</span><span>□</span><span>✕</span></div></div>' +
        '<div class="card">' + R.pageHtml() + (st.pop==="site" ? '<div class="pop site-pop">' + R.sitePanelHtml() + '</div>' : '') + '</div></div>' +
      (cmdOpen ? cmdHtml() : '') + (st.toast ? '<div class="toast" role="status">' + esc(st.toast) + '</div>' : '');
    document.getElementById("app").innerHTML = h;
    if (cmdOpen) { var ci = document.getElementById("cmdq"); ci.focus(); ci.setSelectionRange(ci.value.length, ci.value.length); var sel = document.querySelector(".cmd-i.sel"); if (sel) sel.scrollIntoView({ block: "nearest" }); }
    else if (focusId === "addr") { var a = document.getElementById("addr"); a.focus(); a.setSelectionRange(a.value.length, a.value.length); }
  }
  function cmdHtml(){ var list = commands(), g = null; if (cmdSel >= list.length) cmdSel = Math.max(0, list.length - 1);
    return '<div class="scrim" data-act="cmd-close"><div class="cmd" role="dialog" aria-label="Command bar"><div class="cmd-in">' + I("search") + '<input id="cmdq" placeholder="Type a command, a page, an open tab or an address" value="' + esc(cmdQ) + '" autocomplete="off" aria-label="Command"></div><div class="cmd-list" role="listbox">' +
      list.map(function(x, i){ var head = x.g !== g ? '<div class="cmd-g">' + x.g + '</div>' : ''; g = x.g; return head + '<button class="cmd-i' + (i===cmdSel?' sel':'') + '" role="option" aria-selected="' + (i===cmdSel) + '" data-act="cmd-run" data-i="' + i + '">' + I(x.ic) + '<span>' + esc(x.label) + '</span>' + (x.hint ? '<small>' + esc(x.hint) + '</small>' : '') + '</button>'; }).join('') +
      (list.length ? '' : '<div class="cmd-g">Nothing matches</div>') + '</div><div class="cmd-foot"><span>↑↓ choose</span><span>Enter open</span><span>Esc close</span></div></div></div>'; }
  function extra(e){
    var el = e.target.closest("[data-act]"); if (!el) return false; var a = el.getAttribute("data-act");
    if (a === "sidebar") { mini = !mini; render(); return true; }
    if (a === "cmd") { cmdOpen = true; cmdQ = ""; cmdSel = 0; st.pop = null; render(); return true; }
    if (a === "cmd-run") { runCmd(commands()[+el.getAttribute("data-i")]); return true; }
    if (a === "cmd-close" && e.target === el) { cmdOpen = false; render(); return true; }
    if (cmdOpen && e.target.closest(".cmd")) return true;
    return false;
  }
  function key(e){
    var mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); cmdOpen = !cmdOpen; cmdQ = ""; cmdSel = 0; render(); return; }
    if (mod && e.key.toLowerCase() === "b") { e.preventDefault(); mini = !mini; render(); return; }
    if (!cmdOpen) return;
    if (e.key === "Escape") { cmdOpen = false; render(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); cmdSel = Math.min(cmdSel + 1, commands().length - 1); render(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); cmdSel = Math.max(cmdSel - 1, 0); render(); }
    else if (e.key === "Enter") { e.preventDefault(); runCmd(commands()[cmdSel]); }
  }
  function input(e){ if (e.target.id === "cmdq") { cmdQ = e.target.value; cmdSel = 0; render(); } }
  return { render: render, extra: extra, key: key, input: input };
})();
(function(){ var app = document.getElementById("app"); app.addEventListener("click", function(e){ if (App.extra(e)) e.stopImmediatePropagation(); }, true); app.addEventListener("input", App.input); R.wire(app); R.applyTheme(); App.render(); })();
</script>
