name: release

# Publishes the downloadable zip (and its SHA-256) when a version tag is pushed:  git tag v1.3.9 && git push origin v1.3.9
# install.ps1 (the one-command install) downloads this asset. UNVERIFIED until the first tagged run; if the package
# step needs something this runner lacks, fix it here and re-tag.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Ensure real OpenSSH ssh-keygen is first on PATH
        shell: pwsh
        run: |
          $osdir = Join-Path $env:SystemRoot 'System32\OpenSSH'
          if (Test-Path (Join-Path $osdir 'ssh-keygen.exe')) { $osdir | Out-File -Append -Encoding ascii $env:GITHUB_PATH }
      - name: Package
        shell: pwsh
        env:
          RECOGNITION_PASSPHRASE: ci-package-only
        run: |
          pwsh -File scripts\RUN_PACKAGE_DIST_V1.ps1 -RepoRoot .
          $h = (Get-FileHash dist\Recognition-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  Recognition-win-x64.zip" | Out-File -Encoding ascii dist\Recognition-win-x64.zip.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Recognition-win-x64.zip
            dist/Recognition-win-x64.zip.sha256
